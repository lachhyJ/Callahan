# Included into every location block below. nginx does not inherit add_header
# from an outer block into a location that sets its own, so these genuinely
# have to be repeated per-location — but they're repeated by include, not by
# copy-paste, so there's one place to change them.
#
# __CSP_CONNECT_SRC__ is substituted at image build time (see Dockerfile).
# Production builds are same-origin and get 'self' alone; the local docker-dev
# stack serves the app on :8081 while the API is on :8080, so that build adds
# the API origin explicitly rather than shipping it to the NAS.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src __CSP_CONNECT_SRC__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
