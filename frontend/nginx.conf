server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers live in security-headers.conf and are pulled into each
    # location by include. nginx does not inherit add_header from an outer block
    # into a location that sets its own, so they must appear per-location —
    # include gives that without six copies drifting apart.

    location /api/ {
        include /etc/nginx/security-headers.conf;

        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite's hashed asset filenames (index-<hash>.js/css) change whenever their
    # content does, so it's safe — and desirable — to cache them forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # index.html and the service worker must never be cached: they're the only
    # things that point at the current hashed assets. An installed iOS PWA in
    # particular can otherwise keep serving a stale index.html across sessions
    # indefinitely, silently running old code well after a fresh deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        include /etc/nginx/security-headers.conf;

        try_files $uri $uri/ /index.html;
    }
}
