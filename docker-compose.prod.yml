services:
  backend:
    build: ./backend
    restart: unless-stopped
    # The backend derives "today" from DateTime.Now in ~15 places (streaks,
    # taper phase, the monthly-report lock, trend windows, wellness). Without
    # this the container runs UTC, so "today" was a day behind for the first
    # 10-11 hours of every local day, and TaperReminderService's 20:00 gate —
    # whose comment already said "20:00 local - see docker-compose TZ note" —
    # fired at 06:00 the next morning. tzdata is present in the aspnet image.
    environment:
      - TZ=Australia/Melbourne
    env_file:
      - backend.prod.env
    volumes:
      - /mnt/tank/callahan-data:/app/App_Data
      # Read-only: the program PDF lives in Nextcloud, not this repo — that's
      # the actual authoring surface (see docs/program-sync.md). Path here
      # must match ProgramPdf__Path in backend.prod.env.
      - "/mnt/tank/nextcloud-data/lachlan/files/FilingCabinet/Personal Archive/Fris Resources:/app/ProgramDocs:ro"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
        VITE_VAPID_PUBLIC_KEY: BNdG1ygvo2x1yrr86vLjAbIlejJrQ9eN_YlILa_BEqNPAwN4JbBIIvzxQpaQAJ-WnAAQyreh4hVv4wlWyz8uNSA
    restart: unless-stopped
    ports:
      - "30070:80"
    depends_on:
      - backend

  # Always-on trigger for the app's "Sync Garmin" button. Runs the same
  # scripts/garmin-sync image as the nightly TrueNAS cron job, but with its
  # entrypoint overridden to the tiny HTTP server in trigger_server.py. No
  # host port — only the backend (same network) reaches it, at
  # http://garmin-sync-trigger:8099. The nightly cron `docker run --rm` is
  # unchanged; this is additive and all sync writes are idempotent.
  garmin-sync-trigger:
    build: ./scripts/garmin-sync
    entrypoint: ["python", "trigger_server.py"]
    restart: unless-stopped
    # Same gitignored env file the cron job uses (Garmin + Callahan creds).
    # Add TRIGGER_TOKEN there to require a shared secret on the trigger; the
    # backend sends it as Sync__TriggerToken.
    env_file:
      - /mnt/tank/callahan-data/garmin-sync.env
    environment:
      - HOME=/data
      - CALLAHAN_API_BASE=http://backend:8080
    volumes:
      # Persists garth's Garmin session token + the cached Callahan JWT across
      # restarts, same directory the cron job mounts.
      - /mnt/tank/callahan-data/garmin-sync-state:/data
    depends_on:
      - backend
