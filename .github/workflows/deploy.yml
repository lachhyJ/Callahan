name: Deploy to NAS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (rollback). Leave blank to deploy origin/main."
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Tests gate a push, but deliberately NOT a workflow_dispatch. Manual
      # dispatch is the rollback path, and it exists for exactly the case where
      # main is broken — gating it on main's tests would block the fix. A
      # rollback also deploys a specific old SHA, which these tests (run against
      # the checked-out main) would not be testing anyway.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'

      - uses: actions/setup-dotnet@v6
        if: github.event_name == 'push'
        with:
          dotnet-version: '10.0.x'

      - name: Backend tests
        if: github.event_name == 'push'
        run: dotnet test tests/Callahan.Api.Tests/Callahan.Api.Tests.csproj --nologo

      - uses: actions/setup-node@v7
        if: github.event_name == 'push'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        if: github.event_name == 'push'
        run: npm ci && npm test
        working-directory: frontend

      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: appleboy/ssh-action@v1
        with:
          host: 100.69.5.111
          username: truenas_admin
          key: ${{ secrets.NAS_DEPLOY_SSH_KEY }}
          script: ${{ github.event.inputs.sha }}

      - name: Notify monitor bot on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.MONITOR_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.MONITOR_CHAT_ID }}" \
            -d text="Callahan deploy failed: ${{ github.sha }} — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
