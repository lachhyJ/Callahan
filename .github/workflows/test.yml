name: Tests

# The single definition of the test suite. It runs directly on pushes to any
# branch except main, and on pull requests. Pushes to main reach it through
# deploy.yml, which calls it as a reusable workflow and waits for it before
# deploying, so the suite runs once per push rather than once here and once there.
# Playwright visual tests are not run: their snapshots are macOS renders and
# would not match on a Linux runner.
on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_call:

jobs:
  tracked-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: No build output or backslash paths tracked
        # A commit once added files under a directory literally named "bin\Debug"
        # (backslash in the name), which the bin/ ignore rule did not match.
        run: |
          bad=$(git ls-files | grep -E '\\|(^|/)(bin|obj)/' || true)
          if [ -n "$bad" ]; then
            echo "Tracked build output or backslash paths:"
            echo "$bad"
            exit 1
          fi

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Backend tests
        run: dotnet test tests/Callahan.Api.Tests/Callahan.Api.Tests.csproj --nologo

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
