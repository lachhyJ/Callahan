services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - Cors__AllowedOrigins__0=http://localhost:8081
    volumes:
      - callahan-data:/app/App_Data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8080
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  callahan-data:
